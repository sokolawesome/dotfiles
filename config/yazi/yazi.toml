[mgr]
	linemode      = "mtime"
	mouse_events  = ["click", "scroll"]
	ratio         = [0, 1, 1]
	show_hidden   = true
	sort_by       = "natural"
	sort_translit = true
	title_format  = "Yazi: {cwd}"

[preview]
	image_delay   = 100
	image_filter  = "nearest"
	image_quality = 60
	max_height    = 1080
	max_width     = 1920
	tab_size      = 4
	wrap          = "yes"

[opener]
	edit = [
		{ run = "${EDITOR:-micro} %s", desc = "$EDITOR", for = "unix", block = true },
		{ run = "code %s", desc = "VS Code", for = "unix", orphan = true },
	]
	play = [{ run = "mpv --force-window %s", desc = "Play", for = "linux", orphan = true }]
	exif = [
		{ run = "clear; exiftool %s1; echo 'Press enter to exit'; read _", desc = "Show EXIF", for = "unix", block = true },
	]

[open]
	prepend_rules = [{ url = "*/", use = "open" }, { mime = "image/*", use = ["open", "exif", "reveal"] }]

[plugin]
	prepend_previewers = [{ mime = "video/*", run = "noop" }]

[input]
	cd_offset     = [0, 0, 50, 3]
	cd_origin     = "center"
	create_offset = [0, 0, 50, 3]
	create_origin = "center"
	filter_offset = [0, 0, 50, 3]
	filter_origin = "center"
	find_offset   = [0, 0, 50, 3]
	find_origin   = "center"
	rename_offset = [0, 0, 50, 3]
	rename_origin = "center"
	search_offset = [0, 0, 50, 3]
	search_origin = "center"
	shell_offset  = [0, 0, 50, 3]
	shell_origin  = "center"

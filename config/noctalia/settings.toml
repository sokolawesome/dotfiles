[notification]
monitors = [ "DP-1" ]

[osd]
monitors = [ "DP-1" ]
position = "bottom_center"

    [osd.kinds]
    media = false
    power_profile = false

[plugin_settings."davemhammer/tailscale"]
notify_on_peer_change = false

[plugins]
enabled = [ "davemhammer/tailscale" ]

[shell]
font_family = "IosevkaTerm Nerd Font Mono"
telemetry_enabled = true
time_format = "{:%-I:%M %p}"

    [shell.panel]
    session_placement = "floating"
    session_position = "center"
    wallpaper_placement = "floating"
    wallpaper_position = "center"

    [shell.screenshot]
    save_to_file = false

    [shell.session]
    grid_columns = 2

        [[shell.session.actions]]
        action = "lock"
        countdown_seconds = 5.0
        enabled = true
        shortcut = "1"
        variant = "default"

        [[shell.session.actions]]
        action = "logout"
        countdown_seconds = 0.0
        enabled = false
        shortcut = "2"
        variant = "default"

        [[shell.session.actions]]
        action = "lock_and_suspend"
        countdown_seconds = 0.0
        enabled = false
        shortcut = "3"
        variant = "default"

        [[shell.session.actions]]
        action = "reboot"
        countdown_seconds = 5.0
        enabled = true
        shortcut = "2"
        variant = "default"

        [[shell.session.actions]]
        action = "shutdown"
        countdown_seconds = 5.0
        enabled = true
        shortcut = "3"
        variant = "destructive"

[system.monitor]
enabled = false

[theme]
builtin = "Nord"
community_palette = "Seoul256"
mode = "dark"
pure_black_dark = false
shell_mode = "follow"
source = "community"
wallpaper_scheme = "faithful"

    [theme.templates]
    builtin_ids = [ "btop", "cava", "gtk3", "gtk4", "hyprland", "kitty", "qt" ]
    community_ids = [ "opencode", "zen-browser", "telegram", "micro", "obsidian", "vscode", "fastfetch", "zathura", "bat", "yazi" ]

[wallpaper]
directory = "/home/sokolawesome/Pictures/Wallpapers"

    [wallpaper.default]
    path = "/home/sokolawesome/Pictures/Wallpapers/girl-smoking-city-view.jpg"

    [wallpaper.last]
    path = "/home/sokolawesome/Pictures/Wallpapers/girl-smoking-city-view.jpg"

    [wallpaper.monitors.DP-1]
    path = "/home/sokolawesome/Pictures/Wallpapers/girl-smoking-city-view.jpg"

    [wallpaper.monitors.DP-4]
    path = "/home/sokolawesome/Pictures/Wallpapers/space-galaxy-stars.jpg"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/sokolawesome/Pictures/Wallpapers/girl-smoking-city-view.jpg"

    [wallpaper.monitors.HDMI-A-2]
    path = "/home/sokolawesome/Pictures/Wallpapers/space-galaxy-stars.jpg"

[widget.clock]
format = "{:%a %d %b %-I:%M %p}"

[widget.media]
art_size = 18
artist_first = true
capsule = true
hide_when_no_media = true
max_length = 300
title_scroll = "always"

[widget.network]
show_label = false

[widget.status]
capsule = true
scale = 0.90000000000000002
show_counts = false
type = "davemhammer/tailscale:status"
config_version = 13

[accessibility]
ui_scale = 1.4000000134110451

[bar.default]
end = [ "status", "tray", "notifications", "clipboard", "network", "bluetooth", "volume", "control-center", "session" ]
margin_ends = 6
padding = 18
position = "bottom"
radius = 0
scale = 1.5000000149011612
start = [ "launcher", "wallpaper", "workspaces", "media" ]
thickness = 48

[desktop_widgets]
enabled = false

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-4", "lockscreen-login-box@HDMI-A-2" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-4"]
    box_height = 196.0
    box_width = 810.0
    cx = 1720.0
    cy = 1258.0
    output = "DP-4"
    placement_height = 1440.0
    placement_width = 3440.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-4".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-2"]
    box_height = 196.0
    box_width = 810.0
    cx = 1280.0
    cy = 1258.0
    output = "HDMI-A-2"
    placement_height = 1440.0
    placement_width = 2560.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-2".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[plugin_settings."davemhammer/tailscale"]
notify_on_peer_change = false

[plugins]
enabled = [ "davemhammer/tailscale" ]

[shell]
font_family = "IosevkaTerm Nerd Font Mono"
telemetry_enabled = true

[theme]
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "dysfunctional"

    [theme.templates]
    builtin_ids = [ "cava", "gtk3", "gtk4", "hyprland", "kitty", "qt" ]
    community_ids = [ "zen-browser", "telegram", "yazi" ]

[wallpaper]
directory = "/home/sokolawesome/Pictures/Wallpapers"

    [wallpaper.default]
    path = "/home/sokolawesome/Pictures/Wallpapers/artwork-fantasy-asian.jpg"

    [wallpaper.last]
    path = "/home/sokolawesome/Pictures/Wallpapers/artwork-fantasy-asian.jpg"

    [wallpaper.monitors.DP-4]
    path = "/home/sokolawesome/Pictures/Wallpapers/artwork-fantasy-asian.jpg"

    [wallpaper.monitors.HDMI-A-2]
    path = "/home/sokolawesome/Pictures/Wallpapers/artwork-fantasy-asian.jpg"

[widget.status]
show_counts = false
type = "davemhammer/tailscale:status"
config_version = 14

[accessibility]
ui_scale = 1.3999999999999999

[audio]
enable_sounds = false

[bar.default]
capsule = true
capsule_padding = 7.0
concave_edge_corners = false
end = [ "status", "tray", "notifications", "network", "bluetooth", "volume", "keyboard_layout", "control-center" ]
font_family = "IosevkaTerm Nerd Font Mono"
font_weight = 600
margin_ends = 0
padding = 12
panel_overlap = 0
position = "bottom"
radius = 0
scale = 1.3500000000000001
shadow = false
start = [ "workspaces", "media" ]
thickness = 48
widget_spacing = 10

[brightness]
enable_ddcutil = true
sync_all_monitors = true

[calendar]

[control_center]
hidden_tabs = [ "power" ]

    [control_center.calendar]
    show_week_numbers = true

    [[control_center.shortcuts]]
    type = "wifi"

    [[control_center.shortcuts]]
    type = "bluetooth"

    [[control_center.shortcuts]]
    type = "caffeine"

    [[control_center.shortcuts]]
    type = "nightlight"

    [[control_center.shortcuts]]
    type = "notification"

[desktop_widgets]
enabled = false

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]
pre_action_fade_seconds = 10

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = false
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660.0

[location]
address = "Moscow"

[lockscreen]
fingerprint = false
monitors = [ "DP-1" ]

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [
    "lockscreen-login-box@DP-1",
    "lockscreen-login-box@HDMI-A-1",
    "lockscreen-login-box@FALLBACK",
    "lockscreen-login-box@DP-4",
    "lockscreen-login-box@HDMI-A-2"
]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 1720.0
    cy = 1258.0
    output = "DP-1"
    placement_height = 1440.0
    placement_width = 3440.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
